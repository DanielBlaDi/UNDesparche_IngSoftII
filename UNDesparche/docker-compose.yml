services:
  backend:
    build:
      context: ./backend-undesparche
      dockerfile: Dockerfile
    container_name: django_api
    restart: unless-stopped
    command: >
      sh -c "python3 manage.py makemigrations users events inventory  &&
             python3 manage.py migrate &&
             python3 manage.py createroles &&
             python3 manage.py runserver 0.0.0.0:8000"
    environment:
      DEBUG: ${DEBUG}
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    volumes:
      - ./backend-undesparche:/app
      - static_files:/app/staticfiles
      - media_files:/app/mediafiles
      - ./backend-undesparche/firebase_credentials.json:/app/firebase_credentials.json:ro
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend-undesparche
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL}
    container_name: react_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  static_files:
  media_files:
